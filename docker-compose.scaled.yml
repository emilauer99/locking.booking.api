# Optional: a second spring-boot api instance behind a round robin load balancer (no sticky sessions),
# like the scenario of the exercise. Use together with docker-compose.yml and docker-compose.spring.yml:
#   docker compose -f docker-compose.yml -f docker-compose.spring.yml -f docker-compose.scaled.yml up --build
# The load balancer is reachable under http://localhost:8090, instance 1 still under http://localhost:8080.
services:
  app2:
    image: 'booking_api_spring'
    container_name: booking_api_2
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    # both instances update the schema on startup, if they collide the second one simply starts again
    restart: on-failure
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/compose-postgres
      - SPRING_DATASOURCE_USERNAME=compose-postgres
      - SPRING_DATASOURCE_PASSWORD=compose-postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update

  lb:
    image: 'nginx:1.27-alpine'
    container_name: booking_lb
    ports:
      - "8090:80"
    volumes:
      - ./loadbalancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - app2
