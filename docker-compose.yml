# Shared part of the system (database and ui).
# Combine it with exactly one api file:
#   docker compose -f docker-compose.yml -f docker-compose.spring.yml up --build
#   docker compose -f docker-compose.yml -f docker-compose.dotnet.yml up --build
# A plain "docker compose up" picks the spring-boot api (see .env).
services:
  ui:
    image: 'booking_ui'
    build:
      context: ./ui/msa-booking-app/
    ports:
      - "80:80"
    container_name: booking_ui_1

  db:
    image: 'postgres:17.2-alpine'
    ports:
      - "5432:5432"
    container_name: db
    environment:
      - POSTGRES_USER=compose-postgres
      - POSTGRES_PASSWORD=compose-postgres
