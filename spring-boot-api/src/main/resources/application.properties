spring.datasource.url= jdbc:postgresql://localhost:5432/compose-postgres
spring.datasource.username= compose-postgres
spring.datasource.password= compose-postgres

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation= true
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.PostgreSQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto= update

# schema.sql adds the constraints Hibernate cannot create (exclusion constraint against overlaps)
spring.sql.init.mode= always
spring.sql.init.separator= ^;
spring.jpa.defer-datasource-initialization= true

# show the reason of a conflict (e.g. "room 1 is already booked ...") in the error response
server.error.include-message= always

# how long an unconfirmed reservation blocks its period (ISO-8601 duration)
booking.reservation-ttl= PT5M
