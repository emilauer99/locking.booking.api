# Round robin load balancer for the two api instances (see docker-compose.scaled.yml).
events {}

http {
    upstream booking_api {
        # no ip_hash / sticky sessions: consecutive requests of a client hit different instances
        server app:8080;
        server app2:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://booking_api;
            proxy_set_header Host $host;
            # shows which instance answered a request
            add_header X-Api-Instance $upstream_addr always;
        }
    }
}
