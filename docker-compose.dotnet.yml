# .NET api, use together with docker-compose.yml
services:
  ui:
    depends_on:
      - app

  app:
    image: 'booking_api_dotnet'
    build:
      context: ./dotnet-api/
    ports:
      # the container listens on 80 (ASPNETCORE_URLS), the ui expects the api on 8080
      - "8080:80"
    container_name: booking_api_1
    depends_on:
      - db
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=compose-postgres;Username=compose-postgres;Password=compose-postgres

  db:
    volumes:
      # entity framework has no migrations here, so the tables are created by this script
      # (postgres runs it only when the database is initialized, i.e. in a fresh container)
      - ./dotnet-api/Repository/Scripts/CreateDatabase.txt:/docker-entrypoint-initdb.d/create.sql:ro
